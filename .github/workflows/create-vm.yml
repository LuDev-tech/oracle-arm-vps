name: Try to Create OCI VM

on:
  schedule:
    # Runs every 10 minutes — persistent retry
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.OCI_AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_B64: ${{ secrets.OCI_CLI_KEY_B64 }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        run: |
          set -o pipefail

          pip install oci-cli

          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CLI_KEY_B64 }}" | base64 --decode > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ secrets.OCI_CLI_REGION }}" >> ~/.oci/config

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "oracle-arm-vps" \
            --wait-for-state RUNNING \
            --max-wait-seconds 600 2>&1 || true)

          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "=== OCI OUTPUT ==="
          echo "$OCI_OUTPUT"

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "RUNNING"'; then
            printf '%s_%s\n' VM CREATED_CONFIRMED
            echo "Success! Instance is RUNNING."
            exit 0
          elif echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            printf '%s_%s\n' VM CREATED_CONFIRMED
            echo "Instance PROVISIONING — will become RUNNING shortly."
            exit 0
          elif echo "$OCI_OUTPUT" | grep -qi "out of host capacity"; then
            echo "Out of capacity — will retry in next run."
            exit 1
          elif echo "$OCI_OUTPUT" | grep -qi "TooManyRequests\|throttl"; then
            echo "Rate limited — will retry in next run."
            exit 1
          else
            echo "Error: Unknown response. Check logs."
            exit 1
          fi

      - name: Report outcome
        run: |
          if [ "${{ steps.create_vm.outcome }}" = "success" ]; then
            echo "✅ VM CREATED SUCCESSFULLY!"
            echo "Instance is running in Oracle Cloud."
          else
            echo "❌ Attempt failed — will retry in 10 minutes."
          fi
