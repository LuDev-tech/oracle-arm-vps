name: Try to Create OCI VM

on:
  workflow_dispatch:
  schedule:
    # Backup trigger away from the top of the hour; the job itself loops.
    - cron: "17 */6 * * *"

concurrency:
  group: oracle-arm-vps-launch
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.OCI_AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_B64: ${{ secrets.OCI_CLI_KEY_B64 }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Install OCI CLI
        run: |
          set -euo pipefail
          pip install oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure and validate OCI CLI
        run: |
          set -euo pipefail
          test -n "$COMPARTMENT_ID"
          test -n "$IMAGE_ID"
          test -n "$SUBNET_ID"
          test -n "$AD_NAME"
          test -n "$OCI_CLI_USER"
          test -n "$OCI_CLI_TENANCY"
          test -n "$OCI_CLI_FINGERPRINT"
          test -n "$OCI_CLI_KEY_B64"
          test -n "$SSH_PUBLIC_KEY"
          mkdir -p ~/.oci
          printf '%s' "$OCI_CLI_KEY_B64" | base64 --decode > ~/.oci/oci_api_key.pem
          test -s ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          openssl rsa -in ~/.oci/oci_api_key.pem -check -noout
          case "$SSH_PUBLIC_KEY" in
            ssh-rsa\ *|ssh-ed25519\ *) ;;
            *) echo "Invalid OpenSSH public key format"; exit 1 ;;
          esac
          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
          printf '%s\n' "$SSH_PUBLIC_KEY" > /home/runner/my_ssh_key.pub
          oci iam availability-domain list --compartment-id "$COMPARTMENT_ID" --query "data[?name=='$AD_NAME'] | length(@)" --raw-output | grep -qx '1'

      - name: Retry ARM capacity every 5 minutes
        run: |
          set -u
          ATTEMPT=0
          RETRY_TOKEN="oracle-arm-vps-single-create"

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            echo "=== ATTEMPT $ATTEMPT $NOW ==="

            # Reconcile first. Never launch if the list operation itself failed.
            set +e
            INSTANCES_JSON=$(oci compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "oracle-arm-vps" \
              --all \
              --output json 2>&1)
            LIST_RC=$?
            set -e
            if [ "$LIST_RC" -ne 0 ]; then
              echo "$INSTANCES_JSON"
              if echo "$INSTANCES_JSON" | grep -qi 'TooManyRequests\|throttl\|InternalError\|ServiceUnavailable'; then
                echo "List transient error; waiting 600 seconds."
                sleep 600
                continue
              fi
              echo "Instance reconciliation failed; refusing to launch blindly."
              exit 1
            fi

            EXISTING_ID=$(printf '%s' "$INSTANCES_JSON" | jq -r '.data[] | select(.["lifecycle-state"] != "TERMINATED" and .["lifecycle-state"] != "TERMINATING") | .id' | head -n 1)
            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "Existing non-terminal instance found: $EXISTING_ID"
              for poll in $(seq 1 20); do
                INSTANCE_JSON=$(oci compute instance get --instance-id "$EXISTING_ID" --output json 2>&1 || true)
                STATE=$(printf '%s' "$INSTANCE_JSON" | jq -r '.data["lifecycle-state"] // empty' 2>/dev/null || true)
                echo "Existing instance state: $STATE"
                if [ "$STATE" = "RUNNING" ]; then
                  printf '%s_%s\n' VM CREATED_CONFIRMED
                  echo "Verified oracle-arm-vps is RUNNING: $EXISTING_ID"
                  exit 0
                fi
                if [ "$STATE" = "TERMINATED" ] || [ "$STATE" = "TERMINATING" ]; then
                  break
                fi
                sleep 30
              done
            fi

            # Preserve the OCI CLI exit status.
            set +e
            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file /home/runner/my_ssh_key.pub \
              --assign-public-ip true \
              --display-name "oracle-arm-vps" \
              --output json 2>&1)
            LAUNCH_RC=$?
            set -e
            echo "$OCI_OUTPUT"

            INSTANCE_ID=$(printf '%s' "$OCI_OUTPUT" | jq -r '.data.id // empty' 2>/dev/null || true)
            if [ -n "$INSTANCE_ID" ]; then
              echo "Launch accepted: $INSTANCE_ID"
              for poll in $(seq 1 20); do
                INSTANCE_JSON=$(oci compute instance get --instance-id "$INSTANCE_ID" --output json 2>&1 || true)
                STATE=$(printf '%s' "$INSTANCE_JSON" | jq -r '.data["lifecycle-state"] // empty' 2>/dev/null || true)
                echo "Instance state: $STATE"
                if [ "$STATE" = "RUNNING" ]; then
                  printf '%s_%s\n' VM CREATED_CONFIRMED
                  echo "Verified oracle-arm-vps is RUNNING: $INSTANCE_ID"
                  exit 0
                fi
                if [ "$STATE" = "TERMINATED" ] || [ "$STATE" = "TERMINATING" ]; then
                  echo "Launch reached terminal failure state; reconciling before retry."
                  break
                fi
                sleep 30
              done
              sleep 300
              continue
            fi

            if echo "$OCI_OUTPUT" | grep -qi 'out of host capacity'; then
              echo "Capacity unavailable. Waiting 300 seconds."
              sleep 300
            elif echo "$OCI_OUTPUT" | grep -qi 'TooManyRequests\|throttl'; then
              echo "Rate limited. Waiting 600 seconds."
              sleep 600
            elif [ "$LAUNCH_RC" -ne 0 ] && echo "$OCI_OUTPUT" | grep -qi 'InternalError\|ServiceUnavailable\|timeout\|connection'; then
              echo "Transient OCI error. Waiting 900 seconds after reconciliation."
              sleep 900
            else
              echo "Non-retryable or unrecognized OCI error; stopping instead of looping blindly."
              exit 1
            fi
          done

      - name: Report
        if: always()
        run: echo "The verified ARM capacity workflow finished or was stopped."
