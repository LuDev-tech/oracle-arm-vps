name: Try to Create OCI VM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: oracle-arm-vps-launch
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.OCI_AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_B64: ${{ secrets.OCI_CLI_KEY_B64 }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Install OCI CLI
        run: |
          pip install oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        run: |
          set -euo pipefail
          mkdir -p ~/.oci
          printf '%s' "$OCI_CLI_KEY_B64" | base64 --decode > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_CLI_USER"
            echo "tenancy=$OCI_CLI_TENANCY"
            echo "fingerprint=$OCI_CLI_FINGERPRINT"
            echo "key_file=~/.oci/oci_api_key.pem"
            echo "region=$OCI_CLI_REGION"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
          printf '%s\n' "$SSH_PUBLIC_KEY" > /home/runner/my_ssh_key.pub

      - name: Retry ARM capacity every 5 minutes
        run: |
          set -u
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== ATTEMPT $ATTEMPT $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

            EXISTING_ID=$(oci compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "oracle-arm-vps" \
              --all \
              --query 'data[0].id' \
              --raw-output 2>/dev/null || true)
            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              printf '%s_%s\n' VM CREATED_CONFIRMED
              echo "Existing oracle-arm-vps found: $EXISTING_ID"
              exit 0
            fi

            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file /home/runner/my_ssh_key.pub \
              --assign-public-ip true \
              --display-name "oracle-arm-vps" 2>&1 || true)

            echo "$OCI_OUTPUT"

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "RUNNING"'; then
              printf '%s_%s\n' VM CREATED_CONFIRMED
              echo "Success! Instance is RUNNING."
              exit 0
            fi

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              printf '%s_%s\n' VM CREATED_CONFIRMED
              echo "Instance PROVISIONING."
              exit 0
            fi

            if echo "$OCI_OUTPUT" | grep -qi 'out of host capacity'; then
              echo "Capacity unavailable. Waiting 300 seconds."
              sleep 300
            elif echo "$OCI_OUTPUT" | grep -qi 'TooManyRequests\|throttl'; then
              echo "Rate limited. Waiting 600 seconds."
              sleep 600
            else
              echo "Transient or configuration error. Waiting 900 seconds before retry."
              sleep 900
            fi
          done

      - name: Report
        if: always()
        run: echo "The persistent ARM capacity job finished or was stopped."
